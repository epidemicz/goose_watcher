# Tests the watcher package: header/module parity, typechecks, behaviour
# tests, and the chmod probe. The Goose compiler is built from source at
# a pinned commit: the current API needs post-v2026.3 features (modern
# `extern fn = "sym"` form, `binary::read_i32le`), and no release carries
# them yet. No builtin packages (GOOSE_BUILTIN_LIBS unset): the watcher
# needs neither gfx nor physics, so SDL never enters the build.
# Linux and Windows. macOS is deliberately not in the matrix: its
# backend is untested, and the behaviour tests encode Linux/Windows
# rename pairing that macOS (kqueue, halves unpaired) does not have,
# so a macOS job would go red on tests, not on a backend bug. Add it
# only after a probe run and either gated checks or inode pairing.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# A newer push to the same branch makes the running job's answer stale.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Post-v2026.3, with binary::read_i32le (Oct 31) and the modern extern
  # form. Bump deliberately: the API's minimum-compiler floor moves with it.
  GOOSE_PIN: eadca409f68210893f366e60d0c2f0dc29a339be

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      # One platform failing is a result about that platform, not a
      # reason to stop finding out about the others.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4
        with:
          path: watcher

      # A source checkout beside the package's, at the pinned commit.
      - name: Check out the Goose compiler
        uses: actions/checkout@v4
        with:
          repository: aardappel/goose
          ref: ${{ env.GOOSE_PIN }}
          path: goose

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # In-process runs (goose run) need the C library's headers; the
      # package's layer builds through cmake. Linux runners bring gcc
      # and cmake, but libc6-dev is what TinyCC compiles against.
      # Windows runners already bring MSVC and CMake, so nothing to
      # install there.
      - name: Install C dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake libc6-dev

      - name: Cache the compiler build
        id: cache-goose
        uses: actions/cache@v4
        with:
          path: goose/build
          # The compiler source plus what configures it: a new pin, a new
          # CMakeLists, or a new runner image rebuilds.
          key: goose-${{ env.GOOSE_PIN }}-${{ runner.os }}-${{ hashFiles('goose/CMakeLists.txt', 'goose/cmake/**') }}

      - name: Configure the compiler
        if: steps.cache-goose.outputs.cache-hit != 'true'
        run: cmake -S goose -B goose/build -DCMAKE_BUILD_TYPE=Release

      - name: Build the compiler
        if: steps.cache-goose.outputs.cache-hit != 'true'
        run: cmake --build goose/build --config Release

      # bash on both runners, so the export below works on Windows
      # too (Git Bash); the default PowerShell shell would not run it.
      # The Visual Studio generator puts the compiler in a Release
      # subdirectory; the Make generator puts it directly in build/.
      # `python` (from setup-python) is the portable invocation:
      # `python3` is not guaranteed on Windows runners.
      - name: Test
        working-directory: watcher
        shell: bash
        run: |
          export PATH="$GITHUB_WORKSPACE/goose/build${{ runner.os == 'Windows' && '/Release' || '' }}:$PATH"
          python test/run_tests.py
